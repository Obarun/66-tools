image: obarun/base:latest

stages:
  - build
  - release
  - request
  - docbuild
  - docdeploy

before_script:
  - pacman -Syu --noconfirm
  - pacman -S base-devel meson git lowdown --noconfirm

request:
  stage: request
  script:
  - ./build_toolchain.sh "commit"
  - meson setup build -D test=true
  - meson compile -C build
  - DESTDIR=gitlab-ci meson install -C build

  only:
  - merge_requests

build:
  stage: build
  script:
  - ./build_toolchain.sh
  - meson setup build -D test=true
  - meson compile -C build
  - meson test -C build
  - DESTDIR=gitlab-ci meson install -C build

  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: never
    - if: $CI_COMMIT_BRANCH == "master"

test-sanitizers:
  stage: build
  script:
  - ./build_toolchain.sh
  - meson setup build-asan -D test=true -D b_sanitize=address,undefined
  - meson compile -C build-asan
  - ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 meson test -C build-asan

  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: never
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

release:
  stage: release
  script:
  - ./build_toolchain.sh
  - meson setup build -D test=true -D with-doc=true
  - meson compile -C build
  - meson test -C build
  - DESTDIR=gitlab-ci meson install -C build

  only:
      refs:
        - tags

docbuild:
  stage: docbuild
  script:
  - meson setup build -D with-doc=true -D doc-only=true
  - meson compile -C build doc
  - mkdir -p doc-src
  - cp build/doc/mkdocs/docs/*.md doc/doc.yml doc-src/

  artifacts:
    paths:
      - doc-src/
    expire_in: 1 week

  rules:
    - if: $CI_COMMIT_TAG

# The theme, the mkdocs configuration and the deployment live in
# obdev/docs-builder. Only a tag publishes: without one DOC_VERSION would be
# empty and docs-builder refuses to start.
docpublish:
  stage: docdeploy
  needs:
    - job: docbuild
      artifacts: false
  trigger:
    project: obdev/docs-builder
    strategy: depend

  variables:
    DOC_PROJECT_ID: $CI_PROJECT_ID
    DOC_NAME: $CI_PROJECT_NAME
    DOC_VERSION: $CI_COMMIT_TAG

  rules:
    - if: $CI_COMMIT_TAG
